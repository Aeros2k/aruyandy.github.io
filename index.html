<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Página</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>¡Hola!</h1>

        <p>Esta es mi primera página web.</p>

        <button onclick="alert('¡Hola desde GitHub Pages!')">
            Hacer clic
        </button>
    </div>

</body>
</html>
